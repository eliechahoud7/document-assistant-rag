# Thème et confidentialité de l'interface web (streamlit run app.py).
[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"

[browser]
gatherUsageStats = false

[server]
# Taille maximale d'un fichier reçu par le serveur, en Mo (1 Mo = 1 024 x 1 024 octets) : c'est
# la seule limite appliquée pendant la réception (celle du composant d'envoi n'est vérifiée que
# par le navigateur). Égale à la plus grande limite de l'application (20 Mo en local) ; celle
# des visiteurs (DOCASSIST_UPLOAD_MAX_MB, 10 par défaut) ne peut pas la dépasser.
maxUploadSize = 20

# Pas d'adresse d'écoute ici : Streamlit Community Cloud gère la sienne. En local, l'interface
# donne accès au CV et consomme le quota Gemini : lancez-la toujours avec
# « --server.address localhost » (voir README), sinon elle est visible sur le réseau local.
