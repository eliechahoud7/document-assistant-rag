[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-assistant"
version = "0.1.0"
description = "Intelligent Document Assistant — RAG : questions-réponses citées sur des PDF (FR/EN)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Elie Chahoud" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Ajoutées phase par phase. Borne haute sur la version majeure : LangChain casse
# régulièrement son API entre versions majeures.
dependencies = [
    "pypdf>=6.21,<7",                    # phase 1 : extraction du texte des PDF
    "langchain-text-splitters>=1.1,<2",  # phase 1 : découpage récursif
    "chromadb>=1.5.9,<2",                # phase 2 : base vectorielle locale
    "sentence-transformers>=6.1,<7",     # phase 2 : embeddings E5 (tire torch, CPU sous Windows)
    "google-genai>=2.31,<3",             # phase 4 : génération (API Gemini, niveau gratuit)
    "streamlit>=1.66,<2",                # interface web (app.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Traduction FR -> EN des requêtes (DOCASSIST_QUERY_TRANSLATION=fr-en, désactivée par défaut) :
# tokenizer du modèle Opus-MT. Modèle : python -m doc_assistant download-translation-model
translation = [
    "sentencepiece>=0.2.2,<0.3",
    "sacremoses>=0.2,<0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_assistant = ["py.typed"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]  # rend tests/fakes.py importable
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m", "not slow and not llm and not network",
]
markers = [
    "slow: tests lents (vrais modèles d'embeddings, gros fichiers)",
    "llm: tests qui appellent un vrai LLM (local ou API)",
    "network: tests autorisés à accéder au réseau",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["doc_assistant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # tri des imports
    "B",       # bugbear : bugs probables
    "UP",      # pyupgrade : syntaxe moderne
    "N",       # conventions de nommage
    "SIM",     # simplifications
    "RUF",     # règles spécifiques ruff
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "tests"
warn_unreachable = true
